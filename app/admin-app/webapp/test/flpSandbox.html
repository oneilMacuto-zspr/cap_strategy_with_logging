
<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>FLP Sandbox</title>
    <script
      id="sap-ui-bootstrap"
      src="https://sapui5.hana.ondemand.com/resources/sap-ui-core.js"
      data-sap-ui-theme="sap_fiori_3"
      data-sap-ui-libs="sap.m, sap.ushell, sap.fe.templates"
      data-sap-ui-compatVersion="edge"
      data-sap-ui-preload="async"
      data-sap-ui-resourceroots='{
        "adminapp.adminapp": "../"
      }'>
    </script>

    <script>
      sap.ui.getCore().attachInit(function () {
        sap.ushell.Container.createRenderer().placeAt("content");
      });

      window["sap-ushell-config"] = {
        defaultRenderer: "fiori2",
        bootstrapPlugins: {},
        renderers: {
          fiori2: {
            componentData: {
              config: {
                search: "hidden",
                rootIntent: "Shell-home"
              }
            }
          }
        },
        services: {
          LaunchPage: {
            adapter: {
              config: {
                groups: [{
                  tiles: [
                    {
                      tileType: "sap.ushell.ui.tile.StaticTile",
                      properties: {
                        title: "Sap Fiori Listing App",
                        targetURL: "#adminappadminapp-display"
                      }
                    },
                    {
                      tileType: "sap.ushell.ui.tile.StaticTile",
                      properties: {
                        title: "Reports",
                        targetURL: "#adminappadminapp-overview"
                      }
                    }
                  ]
                }]
              }
            }
          },
          ClientSideTargetResolution: {
            adapter: {
              config: {
                inbounds: {
                  "adminappadminapp-display": {
                    semanticObject: "adminappadminapp",
                    action: "display",
                    title: "Sap Fiori Listing App",
                    resolutionResult: {
                      applicationType: "SAPUI5",
                      additionalInformation: "SAPUI5.Component=adminapp.adminapp",
                      url: "./"
                    }
                  },
                  "adminappadminapp-overview": {
                    semanticObject: "adminappadminapp",
                    action: "overview",
                    title: "Reports",
                    resolutionResult: {
                      applicationType: "SAPUI5",
                      additionalInformation: "SAPUI5.Component=adminapp.adminapp",
                      url: "./"
                    }
                  }
                }
              }
            }
          },
          NavTargetResolution: {
            config: {
              enableClientSideTargetResolution: true
            }
          }
        }
      };
    </script>
  </head>

  <body class="sapUiBody" id="content"></body>
</html>
